spring.application.name=LifeSamadhan API
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database Configuration (Environment variables with sensible defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lifesamadhan_spring?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:LifeSamadhanSuperSecretKey12345678901234567890}
jwt.issuer=LifeSamadhan
jwt.audience=LifeSamadhan-Users
jwt.expiration=86400000

# Server Configuration
server.port=${PORT:8080}
server.error.whitelabel.enabled=false
server.error.include-stacktrace=always
server.error.include-message=always

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Razorpay Configuration
razorpay.key_id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:razorpay_secret_placeholder}

# Email Configuration (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true